<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same pre-paint theme resolution as play.html, and the same storage key, so moving between the
         two pages never flashes or disagrees about the theme. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('temen-play:theme') || 'auto';
          var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme =
            matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      })();
    </script>
    <title>Parity matrices — Temen</title>
    <style>
      /* The playground's token set, verbatim — this page is part of that site, not a visitor. */
      :root {
        --bg: #ffffff; --fg: #1a1d21; --muted: #5c6673; --faint: #8a94a3;
        --border: #e2e6ec; --surface: #f7f8fa; --accent: #2f57d6; --accent-soft: #eef1fb;
        --good: #1a7f37; --bad: #b00020;
        /* Status colours. `declines` is deliberately NOT red: folding to the oracle is the design
           working, not a failure. Only `notyet` — a real gap — gets the warning colour. */
        --st-full: var(--good);
        --st-declines: var(--faint);
        --st-notyet: #b26a00;
        --st-conditional: var(--accent);
        /* An unaudited cell is *unknown*, not passing — muted, so it reads as absent information
           rather than a verdict. The op matrix has none; the frontier matrix (#1413) is full of them
           while it is filled in. */
        --st-unaudited: var(--faint);
      }
      :root[data-theme="dark"] {
        --bg: #111417; --fg: #dfe3e8; --muted: #9aa4b2; --faint: #6f7a89;
        --border: #262c34; --surface: #1a1e23; --accent: #7c8cff; --accent-soft: #1b2340;
        --good: #4cc585; --bad: #ff6b81;
        --st-notyet: #e0a34a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
      a { color: var(--accent); }
      h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -.01em; }
      .sub { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
      code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }

      /* Summary strip: answers "where are we" before any scrolling. */
      .summary { display: flex; flex-wrap: wrap; gap: 1px; background: var(--border);
                 border: 1px solid var(--border); margin-bottom: 18px; }
      .sm { background: var(--bg); padding: 10px 14px; flex: 1 1 130px; }
      .sm .n { font-family: ui-monospace, monospace; font-size: 1.35rem; font-weight: 600;
               font-variant-numeric: tabular-nums; display: block; }
      .sm .k { color: var(--muted); font-size: 12px; }
      .sm.full .n { color: var(--st-full); }
      .sm.declines .n { color: var(--st-declines); }
      .sm.notyet .n { color: var(--st-notyet); }
      .sm.conditional .n { color: var(--st-conditional); }

      .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
      input[type="search"], select {
        font: inherit; padding: 6px 9px; border: 1px solid var(--border);
        border-radius: 4px; background: var(--bg); color: var(--fg);
      }
      input[type="search"] { min-width: 200px; flex: 1 1 220px; }
      label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
      button.link {
        font: inherit; background: none; border: none; color: var(--accent);
        cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px;
      }
      button.link:focus-visible, input:focus-visible, select:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }

      .tablewrap { overflow-x: auto; border: 1px solid var(--border); }
      table { border-collapse: collapse; width: 100%; }
      th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); }
      thead th {
        position: sticky; top: 0; background: var(--surface); z-index: 1;
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
        font-weight: 600; white-space: nowrap;
      }
      thead th.c { text-align: center; }
      tbody tr:last-child td { border-bottom: none; }
      td.op { font-family: ui-monospace, monospace; white-space: nowrap; }
      td.fam { color: var(--muted); font-size: 12px; white-space: nowrap; }
      td.c { text-align: center; }
      /* The glyph carries the status, and the colour reinforces it — never colour alone (the glyph is
         what a colour-blind or monochrome reader gets). */
      .cell { font-size: 14px; cursor: help; }
      .cell.full { color: var(--st-full); }
      .cell.declines { color: var(--st-declines); }
      .cell.notyet { color: var(--st-notyet); }
      .cell.conditional { color: var(--st-conditional); }
      .cell.unaudited { color: var(--st-unaudited); }
      tr.has-note td.op::after { content: "*"; color: var(--muted); }
      tr.open { background: var(--accent-soft); }
      tr.notes td { background: var(--surface); color: var(--muted); font-size: 13px; padding: 8px 12px; }
      tr.notes li { margin: 2px 0; }
      tr.notes ul { margin: 0; padding-left: 18px; }

      .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0;
                color: var(--muted); font-size: 12.5px; }
      .legend span { display: flex; align-items: center; gap: 6px; }
      .empty { padding: 24px; color: var(--muted); text-align: center; }
      footer { margin-top: 28px; color: var(--faint); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>

      <div class="summary" id="summary"></div>

      <div class="controls">
        <label>Matrix
          <select id="matrix"></select>
        </label>
        <input type="search" id="q" aria-label="Search" />
        <label>Status
          <select id="status">
            <option value="">any</option>
            <option value="full">full</option>
            <option value="declines">declines</option>
            <option value="notyet">not yet</option>
            <option value="conditional">conditional</option>
            <option value="unaudited">unaudited</option>
          </select>
        </label>
        <label>on
          <select id="col"></select>
        </label>
        <button class="link" id="disagree" type="button" hidden>Only where the JITs disagree</button>
        <button class="link" id="reset" type="button">Reset</button>
      </div>

      <div class="tablewrap">
        <table>
          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Nothing matches.</div>
      </div>

      <div class="legend" id="legend"></div>
      <footer id="foot">Loading…</footer>
    </div>

    <script>
      // Both matrices are static data generated by `cargo run -p temen-parity`; this page only
      // renders them. One render loop, parameterised by a matrix *descriptor* (INVARIANTS #15: a
      // second matrix is a parameter of the one structure, not a copy of the page). Each descriptor
      // adapts its JSON into the same shape: `columns`, and `rows` of `{ label, group, cells, notes }`.
      const MATRICES = {
        ops: {
          file: 'assets/ops_parity.json',
          title: 'Op × backend parity',
          sub: 'Every IR op against the four backends (DESIGN.md §3). The tree-walk interpreter is the ' +
               'oracle — it defines observable behaviour; the bytecode interpreter is held bit-exact ' +
               'against it; the two JITs are fail-closed accelerators that fold what they cannot run back ' +
               'to the oracle (INVARIANTS.md #9).',
          source: 'OPS_PARITY.md',
          rowNoun: 'ops', colNoun: 'backends', rowHead: 'op', groupHead: 'family',
          search: 'Search op or family…',
          // "The JITs disagree" — Cranelift (2) vs wasm-JIT (3). The interpreters are Full everywhere
          // by construction, so a disagreement between those two is where the interesting work is.
          disagree: [2, 3],
          adapt: (d) => ({
            columns: d.backends.map((b) => ({ label: b.replace(/^temen-/, ''), title: b })),
            rows: d.ops.map((o) => ({ label: o.op, group: o.family, cells: o.cells, notes: o.notes })),
          }),
        },
        frontier: {
          file: 'assets/frontier.json',
          title: 'Capability × axis frontier',
          sub: 'INVARIANTS.md #14 says an accepted capability must hold across seven axes. The op matrix ' +
               'machine-checks one of them at op granularity; this is the machine for the rest (#1413). ' +
               'An unaudited cell is not a passing cell — nobody has established what it is. Columns ' +
               'marked ✓ are checked against live predicates by a conformance test; the rest state the ' +
               'manifest’s belief and nothing more.',
          source: 'FRONTIER.md',
          rowNoun: 'capabilities', colNoun: 'axes', rowHead: 'capability', groupHead: null,
          search: 'Search capability…',
          disagree: null,
          adapt: (d) => ({
            columns: d.axes.map((a) => ({
              label: a.short + (a.conformed ? ' ✓' : ''),
              title: a.question + (a.conformed ? ' (conformance-tested)' : ''),
            })),
            rows: d.rows.map((r) => ({
              label: r.capability, group: null, cells: r.cells,
              notes: r.notes.map((n) => `${n.axis}: ${n.text}`),
            })),
          }),
        },
      };

      const state = { key: 'ops', desc: null, data: null, m: null, q: '', status: '', col: '', disagree: false };
      const el = (id) => document.getElementById(id);

      function matches(row) {
        if (state.q) {
          const q = state.q.toLowerCase();
          if (!row.label.toLowerCase().includes(q) && !(row.group || '').toLowerCase().includes(q)) return false;
        }
        const cells = state.col === '' ? row.cells : [row.cells[Number(state.col)]];
        if (state.status && !cells.includes(state.status)) return false;
        const d = state.desc.disagree;
        if (state.disagree && d && row.cells[d[0]] === row.cells[d[1]]) return false;
        return true;
      }

      function renderHead() {
        const { desc, m } = state;
        const tr = el('head');
        tr.textContent = '';
        const th = (text, cls, title) => {
          const h = document.createElement('th');
          if (cls) h.className = cls;
          if (title) h.title = title;
          h.textContent = text;
          tr.append(h);
        };
        th(desc.rowHead);
        if (desc.groupHead) th(desc.groupHead);
        for (const c of m.columns) th(c.label, 'c', c.title);
      }

      function render() {
        const { desc, data, m } = state;
        const rows = el('rows');
        rows.textContent = '';
        const shown = m.rows.filter(matches);
        const fixedCols = desc.groupHead ? 2 : 1;

        for (const row of shown) {
          const tr = document.createElement('tr');
          if (row.notes.length) tr.className = 'has-note';
          const td = (cls, text) => {
            const d = document.createElement('td');
            if (cls) d.className = cls;
            d.textContent = text;
            return d;
          };
          tr.append(td('op', row.label));
          if (desc.groupHead) tr.append(td('fam', row.group));
          for (const id of row.cells) {
            const d = document.createElement('td');
            d.className = 'c';
            const span = document.createElement('span');
            span.className = 'cell ' + id;
            span.textContent = data.statuses[id].glyph;
            span.title = data.statuses[id].label;
            d.append(span);
            tr.append(d);
          }
          rows.append(tr);

          if (row.notes.length) {
            // Notes are the "why" behind a decline, a condition or a gap — the column the markdown
            // crams into one cell. Here they get their own row, revealed on click so the table stays
            // scannable.
            const nr = document.createElement('tr');
            nr.className = 'notes';
            nr.hidden = true;
            const ntd = document.createElement('td');
            ntd.colSpan = fixedCols + m.columns.length;
            const ul = document.createElement('ul');
            for (const n of row.notes) {
              const li = document.createElement('li');
              li.textContent = n;
              ul.append(li);
            }
            ntd.append(ul);
            nr.append(ntd);
            rows.append(nr);
            tr.style.cursor = 'pointer';
            tr.tabIndex = 0;
            const toggle = () => {
              nr.hidden = !nr.hidden;
              tr.classList.toggle('open', !nr.hidden);
            };
            tr.addEventListener('click', toggle);
            tr.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
            });
          }
        }

        el('empty').hidden = shown.length > 0;
        el('foot').textContent =
          `Showing ${shown.length} of ${m.rows.length} ${desc.rowNoun}. Generated by \`cargo run -p temen-parity\`; ` +
          `pinned by crates/temen-parity/tests/golden.rs.`;
      }

      function renderSummary() {
        const { desc, data, m } = state;
        // Count over every column, so the strip describes the whole matrix rather than a slice of it.
        // Keyed off the JSON's own `statuses` map, not a literal list — a status added to the
        // manifest then shows up here without a second place to remember to edit.
        const counts = Object.fromEntries(Object.keys(data.statuses).map((k) => [k, 0]));
        for (const row of m.rows) for (const c of row.cells) counts[c]++;
        const s = el('summary');
        s.textContent = '';
        const tile = (cls, n, k) => {
          const d = document.createElement('div');
          d.className = 'sm ' + cls;
          const nn = document.createElement('span');
          nn.className = 'n';
          nn.textContent = String(n);
          const kk = document.createElement('span');
          kk.className = 'k';
          kk.textContent = k;
          d.append(nn, kk);
          return d;
        };
        s.append(tile('', m.rows.length, `${desc.rowNoun} × ${m.columns.length} ${desc.colNoun}`));
        for (const id of Object.keys(data.statuses)) {
          // Skip a status this matrix does not use — the op matrix has no unaudited cells, and a
          // zero tile would imply the question was asked and answered.
          if (counts[id] === 0 && id === 'unaudited') continue;
          s.append(tile(id, counts[id], data.statuses[id].label));
        }
      }

      function renderLegend() {
        const { data } = state;
        const l = el('legend');
        l.textContent = '';
        for (const id of Object.keys(data.statuses)) {
          const sp = document.createElement('span');
          const g = document.createElement('span');
          g.className = 'cell ' + id;
          g.textContent = data.statuses[id].glyph;
          const t = document.createElement('span');
          t.textContent = data.statuses[id].label;
          sp.append(g, t);
          l.append(sp);
        }
      }

      async function load(key) {
        const desc = MATRICES[key];
        let data;
        try {
          const res = await fetch(desc.file);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          data = await res.json();
        } catch (e) {
          el('foot').textContent = `Could not load ${desc.file} — ${e.message}. ` +
            `Regenerate it with \`cargo run -p temen-parity\`.`;
          return;
        }
        Object.assign(state, { key, desc, data, m: desc.adapt(data), q: '', status: '', col: '', disagree: false });
        document.title = `${desc.title} — Temen`;
        el('title').textContent = desc.title;
        const sub = el('sub');
        sub.textContent = desc.sub + ' Generated from the same manifest as ';
        const a = document.createElement('a');
        a.href = `https://github.com/theSherwood/temen/blob/main/${desc.source}`;
        a.textContent = desc.source;
        sub.append(a, ' and pinned by a golden test, so this page cannot show a matrix the tree does not have. ');
        const back = document.createElement('a');
        back.href = 'play.html';
        back.textContent = '← playground';
        sub.append(back);

        el('q').value = '';
        el('q').placeholder = desc.search;
        el('status').value = '';
        const col = el('col');
        col.textContent = '';
        const any = document.createElement('option');
        any.value = '';
        any.textContent = `any ${desc.colNoun.replace(/s$/, '')}`;
        col.append(any);
        state.m.columns.forEach((c, i) => {
          const o = document.createElement('option');
          o.value = String(i);
          o.textContent = c.title || c.label;
          col.append(o);
        });
        el('disagree').hidden = !desc.disagree;

        renderHead();
        renderSummary();
        renderLegend();
        render();
        history.replaceState(null, '', key === 'ops' ? location.pathname : `?m=${key}`);
      }

      function main() {
        const sel = el('matrix');
        for (const [key, d] of Object.entries(MATRICES)) {
          const o = document.createElement('option');
          o.value = key;
          o.textContent = d.title;
          sel.append(o);
        }
        const initial = new URLSearchParams(location.search).get('m');
        const key = initial in MATRICES ? initial : 'ops';
        sel.value = key;
        sel.addEventListener('change', (e) => load(e.target.value));

        el('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
        el('status').addEventListener('change', (e) => { state.status = e.target.value; render(); });
        el('col').addEventListener('change', (e) => { state.col = e.target.value; render(); });
        el('disagree').addEventListener('click', () => { state.disagree = !state.disagree; render(); });
        el('reset').addEventListener('click', () => {
          Object.assign(state, { q: '', status: '', col: '', disagree: false });
          el('q').value = ''; el('status').value = ''; el('col').value = '';
          render();
        });
        load(key);
      }

      main();
    </script>
  </body>
</html>
