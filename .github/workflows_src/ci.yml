name: CI
on:
  push:
    branches: [main]
    # Doc-only changes don't affect build/test/fuzz, so skip the (slow) matrix for them.
    # `paths-ignore` skips a run only when EVERY changed file matches — a mixed code+doc
    # commit still runs. OPS_PARITY.md is generated + golden-tested, but any change to it
    # rides with a `.rs` change (regeneration), so mixed-changeset CI still covers it; the
    # only uncovered case is a lone hand-edit of that generated file, which is a misuse.
    # NOTE (required checks): if `build · test · fmt · clippy` is a *required* status check
    # in branch protection, a doc-only PR skips it and GitHub reports it as missing, blocking
    # the merge (same failure mode as the miri note in workflows_src/README.md). On copy-over,
    # either exclude doc-only PRs from that requirement or merge them without the gate.
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 7 * * *" # daily extended fuzz
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Ride out transient crates.io connection resets instead of failing the job (ISSUES.md I18:
  # a cold `cargo build`'s registry download died `curl [56] Connection reset by peer` and cost a
  # manual re-run). Cargo's default is 3 quick retries; 10 with the longer timeout spans a
  # multi-second registry blip.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "60"
  # Pin stable so a channel roll can't silently introduce new clippy/rustc lints
  # under -D warnings (bump deliberately, same posture as the nightly-pinned fuzz job).
  RUST_STABLE: "1.97.0"
  # The Postgres the playground ships. One source of truth on purpose: it keys the build-input cache
  # *and* is read by build-pg-assets.mjs. If those two ever disagree, a bump would hit the old
  # version's cached bitcode + cluster, skip the rebuild, and ship the old Postgres — silently.
  TEMEN_PG_VER: "17.5"

jobs:

  check:
    name: build · test · fmt · clippy
    runs-on: ubuntu-latest
    # Backstop for an unforeseen liveness hang (e.g. ISSUES.md I7): bound the job to minutes, not
    # GitHub's 6 h default, so a wedged `cargo test --workspace` fails the run instead of sitting
    # stuck for hours. The named work-stealing demos already fail-fast in-test (run.rs); this covers
    # anything else. Generous vs. a healthy cold-cache run (fmt + clippy + build + test + windows
    # cross-check), tight vs. a hang.
    timeout-minutes: 30
    # ISSUES.md I30, sightings 4-5 (2026-07-24, both PR #427 runs — WITH the -j 2 cap): the test
    # link phase still OOM-kills the runner (~55 s in, agent lost, no logs). The dominant term in
    # each heavy link is DEBUG INFO for the Cranelift/Wasmtime-sized dep graph, so drop it from
    # the test profile on this job: symbol names (and thus panic backtraces) survive — only line
    # tables go — while per-link memory falls by multiples. The dedicated debug/sanitizer lanes
    # keep their own profiles.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # ISSUES.md I30 durable mitigation (three sightings: a rust-lld SIGBUS, then two runner
      # losses ~50 s into this step on 2026-07-23): the test build's parallel LINK phase is the
      # memory peak — several temen-jit test binaries (each pulling the large Cranelift + Wasmtime
      # rlibs) linking concurrently can OOM a 16 GB runner under neighbor pressure, which kills
      # the runner agent (no logs, step frozen "in_progress"). Cap build parallelism to bound
      # concurrent links; the step is warm-cache dominated, so the wall-clock cost is small.
      - run: cargo test --workspace -j 2
      - run: rustup target add x86_64-pc-windows-gnu
      # The §5 W3 trap-capture C shim (trap_capture.c) is compiled for windows targets too, so the
      # windows-gnu cross-check needs the mingw cross-compiler. (The MSVC build runs on windows-latest.)
      # ISSUES.md I34: fetch steps carry their own timeout so a wedged mirror fails fast into a
      # re-run instead of eating the whole job budget (a 29 min apt stall burned one 2026-07-23).
      - name: install mingw cross toolchain
        timeout-minutes: 15
        run: sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true && sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  # Guard against the I26/I42/I49 class: a play.js demo card referencing an asset that isn't shipped
  # (neither committed under browser/web/assets/ nor declared deploy-built) → the card 404s. Cheap,
  # no toolchain (Node is preinstalled) — the required set is derived from web/play.js, so new cards
  # are covered automatically. The complementary "is every required asset actually assembled into the
  # published site" check runs at deploy time in pages.yml (--site mode).
  playground-assets:
    name: playground assets accounted for
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: node browser/check-play-assets.mjs

  # Tier-2 end-to-end: build the real nimony toolchain and run `crates/temen-leng/tests/nim_e2e.rs`,
  # which compiles small **Nim source** programs through `nimony c` (→ nifler → nimony → hexer) and
  # runs them on both Temen engines. Nothing mid-pipeline is committed — the toolchain regenerates the
  # `.x.nif` each run, so the tests can't rot against a stale snapshot. Without this job the same
  # tests still run in `check` but *skip* (no toolchain); here they actually execute.
  # NOTE (owner): actions pinned by SHA per repo convention EXCEPT `alaviss/setup-nim` (no vetted SHA
  # to hand) — pin it when you copy this over. The nimony build is heavy (~10-15 min cold); the cache
  # makes warm runs cheap.
  nim-e2e:
    name: nim end-to-end (real toolchain → temen)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # `submodules: recursive` fetches the vendored nimony + nativenif submodules that
      # provision-nimony.sh builds. Only this job needs them, so the other jobs' checkouts stay bare.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # #856 — `setup-nim` resolves `version: devel` to the nim-lang/nightlies `latest-devel` release,
      # which is transiently ABSENT for a short window while the nightly is being re-cut. The observed
      # flake was exactly that: "Could not find any release named 'latest-devel'", failing in ~188 ms
      # before any repo code ran. That window is upstream timing, not a repo failure — so wait for the
      # release to reappear before invoking setup-nim instead of reddening the run on it. Bounded
      # (~5 min of backoff): a genuine upstream outage still fails the job well inside the 45-min budget.
      - name: Wait for the Nim devel nightly to be published (#856)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          api='https://api.github.com/repos/nim-lang/nightlies/releases/tags/latest-devel'
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$api" || echo 000)
            if [ "$code" = 200 ]; then
              echo "nim-lang/nightlies latest-devel is published (HTTP 200, attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}: latest-devel not resolvable yet (HTTP ${code}); backing off..."
            [ "$attempt" = 6 ] || sleep "$((attempt * 20))"
          done
          echo "::error::nim-lang/nightlies latest-devel still missing after 6 attempts — likely a genuine upstream outage, not the usual re-cut window (#856)."
          exit 1
      - name: Setup Nim (devel)
        uses: alaviss/setup-nim@0.1.1 # owner: pin by SHA on copy-over
        with:
          path: nim
          version: devel
      - name: Cache nimony toolchain build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            nimony/bin
            ~/.cache/nim
          key: nimony-${{ runner.os }}-096de9a-${{ hashFiles('scripts/ci/provision-nimony.sh') }}
          restore-keys: nimony-${{ runner.os }}-096de9a-
      - name: Build nimony toolchain
        run: scripts/ci/provision-nimony.sh "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Nim end-to-end tests (both engines)
        run: cargo test -p temen-leng --test nim_e2e -- --nocapture
      - name: Nim language conformance matrix (#956)
        run: cargo test -p temen-leng --test nim_conformance -- --nocapture

  # The CI token can't push `.github/workflows/` (needs the `workflow` OAuth scope), so agent-authored
  # workflow changes are staged in `.github/workflows_src/` and the owner copies them over
  # (`cp .github/workflows_src/*.yml .github/workflows/`). This guard reds the run when the two drift —
  # a staged change hasn't been applied, or one dir was edited without the other — so pending workflow
  # changes can't be silently forgotten. (This job lives in the copied-over `.github/workflows/ci.yml`,
  # so it can only start catching drift once the two are first brought into sync.)
  workflows-in-sync:
    name: workflows_src == workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: .github/workflows_src/*.yml must match .github/workflows/*.yml
        run: |
          set -u
          fail=0
          shopt -s nullglob
          # Every staged .yml must exist in workflows/ and be byte-identical.
          for src in .github/workflows_src/*.yml; do
            base=$(basename "$src")
            dst=".github/workflows/$base"
            if [ ! -f "$dst" ]; then
              echo "::error file=$src::$base is in workflows_src/ but not workflows/ — copy it over"
              fail=1
            elif ! diff -u "$dst" "$src"; then
              echo "::error file=$src::$base differs from workflows/$base — run: cp .github/workflows_src/*.yml .github/workflows/ (see .github/workflows_src/README.md)"
              fail=1
            fi
          done
          # And nothing may live only in workflows/ (a .yml deleted from the source but left running).
          for dst in .github/workflows/*.yml; do
            base=$(basename "$dst")
            if [ ! -f ".github/workflows_src/$base" ]; then
              echo "::error file=$dst::$base is in workflows/ but not workflows_src/ — add it to the source (or delete it)"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then echo "workflows_src/ and workflows/ are in sync."; fi
          exit "$fail"

  fuzz-matrix-in-sync:
    name: fuzz targets wired
    runs-on: ubuntu-latest
    # A fuzz target file with no [[bin]] never builds; one with no matrix row builds but never runs —
    # zero coverage, silently (the exact hole the fuzz job's "keep this list in lockstep" comment
    # warns about). Gate it mechanically, the same way `workflows-in-sync` gates the mirror.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: fuzz_targets/*.rs == fuzz/Cargo.toml [[bin]] == ci.yml fuzz matrix
        run: ./scripts/ci/check-fuzz-matrix.sh

  cross-os:
    name: build · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Same I7 backstop as `check` (windows/macOS runners are slower, so a wider bound).
    timeout-minutes: 45
    # CI-speed + I3: drop test-binary debug info. Generating it (PDBs on Windows especially) is a
    # large fraction of the cross-OS `cargo test` compile+link — this is the run's critical path
    # (~20 min on windows-latest) — and the debug info is unused here (backtraces keep symbol names).
    # The `check` gate already runs with this (I30); mirroring it also lowers the Windows link-memory
    # peak that I3 aborts on. Behavior is unchanged.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    # Gating (no continue-on-error): windows/macOS build+test parity blocks the merge.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  fuzz:
    name: cargo-fuzz (all targets)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # EVERY declared fuzz target gates nightly — no built-but-unwired target may exist (a fuzzer
      # that never runs is zero coverage silently). The escape-TCB hinges (decode_verify, mask,
      # spec_verify) plus the differential/miscompile finders: diff (interp⇄JIT), fork_diff
      # (oracle⇄bytecode fork), wasm_diff (interp⇄wasm-JIT, the third confinement lowering), onramp_diff
      # (LLVM on-ramp source oracle), wasm_transpile, spec_ops, roundtrip (format identity), opt_*
      # (SSA round-trip / SCCP), coverage_walk, and the durable freeze/thaw family (interp + JIT). Keep
      # this list in lockstep with fuzz/fuzz_targets/*.rs.
      matrix:
        target:
          [
            decode_verify,
            diff,
            wasm_diff,
            fork_diff,
            mask,
            wasm_transpile,
            spec_ops,
            spec_verify,
            roundtrip,
            onramp_diff,
            opt_sccp,
            opt_ssa_roundtrip,
            coverage_walk,
            durable,
            durable_fiber,
            durable_jit,
            durable_loop,
            durable_loop_jit,
            durable_recycle,
            durable_recycle_jit,
          ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Pinned to a dated nightly, unlike the other nightly lanes (ISSUES.md I18): this job's first
      # step *builds cargo-fuzz from source*, so its health depends on `latest nightly × cargo-fuzz's
      # locked dep tree` compiling at 07:00 UTC — which broke for 5 straight nights (Jun 4-9, rustix
      # vs a new reserved attribute) and silently produced zero fuzz coverage. The fuzz *targets*
      # need nightly features, not the newest nightly. Bump the date deliberately (with the
      # cargo-fuzz version) rather than riding the channel.
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { toolchain: nightly-2026-07-01 }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: fuzz }
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096

  bench:
    # Non-gating perf signal (DESIGN §1a). Wall-clock on shared runners is noisy and the
    # committed `bench/baseline.txt` records *another* machine's ratios, so this never blocks a
    # merge (`continue-on-error`) and runs only nightly / on demand. A wide `--tol` (40%) means
    # only a gross regression — e.g. SSA promotion or mask-elision silently dropping, which is
    # multiples, not percent — trips it; small cross-machine drift is ignored. (The *exact*
    # promotion guard is the deterministic `c_frontend` memory-op test in the gating job.)
    name: bench regression check (non-gating)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: bench }
      # `cargo run` builds the chibicc fork itself (for the `alu_c` kernel); make + cc are
      # preinstalled on ubuntu-latest. If the frontend can't build, that kernel is skipped.
      - name: bench --check vs committed baseline
        working-directory: bench
        run: cargo run --release -- --check baseline.txt --tol 0.4

  loom:
    name: loom (parallel scheduler model check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: loom model check
        run: cargo test -p temen-jit --lib loom
        env:
          RUSTFLAGS: "--cfg loom"

  temen-llvm:
    name: temen-llvm (LLVM→IR on-ramp · Linux-only)
    runs-on: ubuntu-latest
    # Normal lane time is ~20 min. Without a timeout, one wedged fixture compile burns the 6-hour
    # GitHub default before reporting — seen once as a rustc hang inside std_guest's build-std
    # fixture (issue #906).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: crates/temen-llvm }
      - name: install LLVM/clang 18 (out-of-process build tools, no dev headers)
        # The on-ramp now reads **textual `.ll`** via an in-house parser — it no longer links
        # libLLVM, so the `-dev` headers/lib are gone. The test harness still shells out to two
        # ordinary build-time tools: `clang` (compile the C/C++ corpus to bitcode) and `llvm-dis`
        # (disassemble it to `.ll` for the reader). Both ship in the base `llvm-18`/`clang-18`
        # packages, as do the `llvm-link-18`/`opt-18` the peval probe uses.
        run: |
          # ISSUES.md I67: drop the runner's unused microsoft/azure apt sources so a transient
          # 403/outage from those mirrors can't fail `apt-get update` before we install anything.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: install Rust 1.81 (LLVM 18) for the peval Futamura probe only
        # NOT for the Rust breadth lane anymore — that runs on the default stable `rustc` (its LLVM
        # flows through the textual reader; the version-tolerance proof). This pin remains solely for
        # the multi-crate `peval_*` probe (`tests/common/mod.rs`): it links the whole fixture closure
        # with `llvm-link-18` and DCEs it with `opt-18`, and those LLVM-18 CLI tools can only ingest
        # LLVM-18 IR — so the fixture must be built by a version-matched `rustc` (1.81 = LLVM 18.1).
        # Without it the `peval_futamura`/`peval_jit`/`peval_in_sandbox` tests auto-skip (don't fail).
        run: rustup toolchain install 1.81.0 --profile minimal
      - name: fmt · clippy · test
        working-directory: crates/temen-llvm
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  std-guest:
    name: rust-temen std lane (build-std · lean + threads · nightly)
    # The `std_guest` suite auto-skips in the always-on `temen-llvm` job (it needs a nightly toolchain
    # with `rust-src` and the temen std overlay applied — absent there). This job provides that lane so
    # the tests actually run: both target specs (lean `x86_64-unknown-temen` and threaded
    # `x86_64-unknown-temen-threads`) are compiled via `-Zbuild-std`, translated, verified, and run.
    # Nightly-only (like `cc1-self-compile-giants` / `full-depth-gates` / `nim-e2e`): each test does a
    # full `build-std` (~40 s) and they run serially, too slow for the per-PR gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A firm ceiling: even with the per-build guard below, cap the whole job so a pathological stall
    # cancels in ~1 h, never the 6 h max-timeout wedge of #788.
    timeout-minutes: 75
    env:
      # `-Zbuild-std` recompiles std from source; the workflow-global `-D warnings` would fail that
      # build on any std warning (as the wasm build-std lane already overrides).
      RUSTFLAGS: ""
      # #788 wedge guard, enforced inside the harness (`build_std_bin_ll_target`): kill and skip any
      # single `build-std` that runs longer than this, so one hung `rustc` can't stall the job.
      TEMEN_STD_BUILD_TIMEOUT_SECS: "480"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      # The harness shells out to `cargo +nightly rustc -Zbuild-std …`, so nightly + rust-src must be
      # present. rust-src is the component the overlay patches.
      - name: install nightly + rust-src (for -Zbuild-std)
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: crates/temen-llvm }
      - name: apply the temen std overlay to nightly's rust-src
        run: crates/temen-llvm/rust-temen/apply-overlay.sh
      - name: std_guest suite (lean + threads specs)
        working-directory: crates/temen-llvm
        # Single-threaded: the tests already run serially, and forcing one thread keeps the build-std
        # timeout accounting per-test rather than racing several `rustc` builds at once.
        run: cargo test --test std_guest -- --test-threads=1 --nocapture

  cc1-self-compile:
    name: cc1 self-compile differential (Linux-only)
    runs-on: ubuntu-latest
    # The guest compiler runs under the tree-walk interpreter — slow but finite. Bound a wedged run
    # rather than sit at GitHub's 6 h default; generous vs. a cold-cache build + the ~2 min run.
    timeout-minutes: 25
    # ISSUES.md I30: the temen test-binary LINK phase (Cranelift + Wasmtime rlibs) is the memory peak;
    # drop test debug info (symbols/backtraces survive, only line tables go) as the `check` job does.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: install clang (native reference compiler)
        # The differential clang-builds a *native* chibicc reference (chibicc_ref) and `make`s the
        # chibicc fork with the system cc. `make`/`cc` are preinstalled on the runner; clang may not
        # be — the test prefers `clang-18` and falls back to `clang`, so plain `clang` suffices.
        # ISSUES.md I34: bound the fetch so a wedged mirror fails fast into a re-run.
        timeout-minutes: 15
        run: sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true && sudo apt-get update && sudo apt-get install -y clang
      # The heavy self-compile gate is #[ignore]d — too slow (~2 min) for the inner
      # `cargo test --workspace` loop: it `make`s chibicc, compiles ~10 TUs `--emit-object`, links +
      # verifies a ~300-function module, runs it on the tree-walk interpreter AND the JIT, and
      # clang-builds the native reference — for a base program, an `#include`-from-memfs program, and
      # the feature-diverse corpus. Running it here makes the guest-vs-native IR differential actually
      # gate merges (SELFHOST_C.md §5 E), instead of only when someone runs it by hand. `-j 2` bounds
      # the concurrent heavy links (I30 OOM guard), matching the `check` job. `--ignored` (no name
      # filter) runs *every* heavy c_link gate — both `whole_cc1_self_compiles…` and the stage-2
      # `whole_cc1_compiles_its_own_tu…` (the guest compiling chibicc's own TUs) — so a new heavy test
      # gates automatically rather than silently going unrun.
      - run: cargo test -p temen --test c_link -j 2 -- --ignored

  cc1-self-compile-giants:
    name: cc1 self-compile - giant TUs (nightly)
    # The three giant cc1 TUs (preprocess.c/parse.c/codegen_ir.c, 1.2k-3.4k lines) compiled by the
    # guest on two engines run ~8 min locally (more on CI) - too slow for the per-PR gate, so like
    # miri they ride the daily schedule + manual workflow_dispatch, not every PR. Together with the
    # five tractable TUs in the always-on cc1-self-compile job this completes per-TU byte-identity
    # across ALL NINE cc1 TUs - the sufficient condition for the chibicc2 == chibicc3 fixpoint
    # (SELFHOST_C.md section 5 E): the guest's objects link to the native-built guest, which reproduces
    # its own output. The whole_cc1_compiles_giant_tus test self-skips unless TEMEN_SELFHOST_GIANTS=1.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      TEMEN_SELFHOST_GIANTS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: install clang (native reference compiler)
        timeout-minutes: 15
        run: sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true && sudo apt-get update && sudo apt-get install -y clang
      - run: cargo test -p temen --test c_link -j 2 -- --ignored whole_cc1_compiles_giant_tus

  full-depth-gates:
    name: full-depth interpreter gates (nightly)
    # The #[ignore]d full-depth CORRECTNESS gates (not benches): Lua's own test suite
    # (lua_tlib/lua_all/lua_sweep) run end-to-end on BOTH the bytecode engine and the tree-walker, and
    # the whole-language capstones — the Tcl 8.6 core (demo_tcl_repl_stdin/demo_tcl_init_stdin) and the
    # full sqlite logic-test sweep (demo_sqlite_logictest_full, ~46k records). Each asserts byte-identity
    # with the native `cc` build. They're #[ignore]d purely for wall-clock — a whole interpreter on the
    # tree-walker is minutes per suite (api.lua alone ~7 min on bytecode; the lua sweep ~15 min) — so
    # like `miri`/giants they ride the daily schedule + manual dispatch, not the per-PR gate. Before
    # this job these gates ran only when someone typed `--ignored` by hand: the temen-llvm job's plain
    # `cargo test` covers only the JIT variants, and that JIT-only blind spot already let the QuickJS
    # on-ramp recipe drift unseen once (translate.rs). The capstones self-skip loudly (never fail) when
    # clang/curl/make/openlibm are unavailable — grep the log for `skipping` before trusting a green run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: crates/temen-llvm }
      - name: install LLVM/clang 18 (+ make/curl for the capstone fetchers)
        # Same out-of-process build tools as the temen-llvm job (clang-18 + llvm-dis for the on-ramp);
        # make + curl let the Tcl/sqlite capstones fetch and build their sources rather than self-skip.
        run: |
          # ISSUES.md I67: drop the runner's unused microsoft/azure apt sources so a transient
          # 403/outage from those mirrors can't fail `apt-get update` before we install anything.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 make curl
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      # temen-llvm is workspace-excluded, so run from its own directory (like the `temen-llvm` job) rather
      # than `-p temen-llvm`. `--ignored` per test binary runs exactly that binary's ignored set: the lua
      # binaries hold only the full-depth suites, and `translate`'s ignored set is the three capstones
      # (both #[ignore]d Tcl demos + the full sqlite sweep) — no perf benches ride along.
      - name: Lua full-depth suite (bytecode + tree-walker)
        working-directory: crates/temen-llvm
        run: |
          cargo test --test lua_tlib  -- --ignored
          cargo test --test lua_all   -- --ignored
          cargo test --test lua_sweep -- --ignored
      - name: whole-language capstones (Tcl REPL/init, full sqlite sweep)
        working-directory: crates/temen-llvm
        # --nocapture so the loud self-skips ("skipping tcl"/"skipping quickjs") are visible in the log;
        # a green run with a skip note is NOT a real pass (see the harness comments in translate.rs).
        run: cargo test --test translate -- --ignored --nocapture

  miri:
    # Run the unsafe memory substrate under Miri's UB/provenance + data-race checkers. temen-mem is
    # Miri-aware (a heap-backed fallback replaces the mmap FFI under `cfg(miri)`), so its raw-pointer
    # atomics and the Mapped-vs-Paged differential get provenance/race-checked — complementing loom
    # (which models the protocol atomics) and TSan.
    #
    # Nightly + manual only (CI speed): Miri interprets temen-mem and takes ~18 min — second only to the
    # windows `build · test` on the run's critical path. The unsafe substrate it guards changes rarely,
    # so it rides the daily `schedule` cron like the other deep UB checks (asan/tsan/asan-jit-setjmp)
    # rather than gating every PR. NOTE: if `miri` is a *required* status check in branch protection,
    # drop it from that list (a skipped required check blocks merges).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: miri (temen-mem unsafe substrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo +nightly miri test -p temen-mem
        env:
          # Miri's weak-memory emulation ICEs on the differential test's mixed-size atomic accesses
          # ("partially overlapping store buffer when previous write was atomic" — a Miri bug, not ours).
          # Disabling it keeps full UB / provenance / data-race / alignment checking.
          MIRIFLAGS: "-Zmiri-disable-weak-memory-emulation"

  supply-chain:
    # Scan the dependency tree against the RustSec advisory DB. Gated off pull_request so a
    # newly-published advisory on a transitive dep surfaces on main / nightly without blocking
    # unrelated feature PRs (same posture as the fuzz/bench jobs).
    name: cargo-audit (advisory scan)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  asan:
    # AddressSanitizer over the fiber stack-switch paths. temen-fiber's `asan` feature emits the
    # __sanitizer_{start,finish}_switch_fiber annotations so ASan can follow manual stack switches.
    name: ASan (temen-fiber switches)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { components: rust-src }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo test -p temen-fiber (ASan + asan feature)
        run: cargo test -p temen-fiber --features asan -Z build-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          # The scheduler intentionally leaks values live on a dropped-suspended fiber's stack
          # (documented), so leak detection would false-positive — keep it to UB/races here.
          ASAN_OPTIONS: "detect_leaks=0"

  tsan:
    # ThreadSanitizer over the shared-region hardware atomics (temen-mem's parallel vCPU substrate).
    name: TSan (temen-mem concurrency)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { components: rust-src }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo test -p temen-mem (TSan)
        run: cargo test -p temen-mem --tests -Z build-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=thread"

  wasm32-differential:
    name: wasm32 differential (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: browser }
      - run: rustup target add wasm32-unknown-unknown
      # gencorpus (native) writes corpus.json + corpus/*.temenc; build the wasm32 lib; diff in Node
      # (Node is preinstalled on ubuntu-latest — corpus.mjs needs only WebAssembly + BigInt).
      - name: wasm32 corpus differential (119/119 vs native)
        working-directory: browser
        run: |
          cargo run --bin gencorpus
          cargo build --release --lib --target wasm32-unknown-unknown
          node corpus.mjs target/wasm32-unknown-unknown/release/temen_browser.wasm

  wasm64-differential:
    name: wasm64 differential (Wasmtime embedding)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "" # override the global -D warnings: -Z build-std recompiles std from source
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { components: rust-src }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            browser
            browser/wt
      - name: wasm64 corpus differential (119/119 vs native)
        working-directory: browser
        run: |
          cargo run --bin gencorpus
          cargo build -Z build-std=std,panic_abort --release --lib \
            --target wasm64-unknown-unknown
          cargo run --manifest-path wt/Cargo.toml --release -- \
            target/wasm64-unknown-unknown/release/temen_browser.wasm

  asan-jit-setjmp:
    # AddressSanitizer over the JIT setjmp/longjmp path (Option B: libc _setjmp/_longjmp called
    # inline from JITted code — memory-unsafe native-stack manipulation, so it gets temen-fiber-grade
    # rigor, LLVM.md §"JIT longjmp"). Runs the on-ramp setjmp differential (all engines incl. the
    # live JIT == native) under ASan. The baked _setjmp/_longjmp addresses resolve to ASan's
    # interceptors, which unpoison the stack on the non-local jump — so a returns-twice mishandle
    # surfaces here as a red-zone/use-after-return report rather than silent corruption.
    name: ASan (JIT setjmp/longjmp)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { components: rust-src }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: crates/temen-llvm }
      - name: install LLVM/clang 18 (build tools for the temen-llvm test harness)
        run: |
          # ISSUES.md I67: drop the runner's unused microsoft/azure apt sources so a transient
          # 403/outage from those mirrors can't fail `apt-get update` before we install anything.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: cargo test -p temen-llvm setjmp (ASan, JIT path live)
        run: cargo test --manifest-path crates/temen-llvm/Cargo.toml --tests -Z build-std --target x86_64-unknown-linux-gnu setjmp
        env:
          # -Zsanitizer=address replaces the workflow-global `-D warnings`: -Z build-std recompiles
          # std from source, which would trip warnings-as-errors (same reason the wasm64 lane clears it).
          RUSTFLAGS: "-Zsanitizer=address"
          # The fiber scheduler intentionally leaks values on a dropped-suspended fiber's stack, so
          # keep leak detection off and check UB/use-after-return/red-zones only (matches the asan lane).
          ASAN_OPTIONS: "detect_leaks=0"

  browser-real:
    name: real-browser (Chromium via Playwright)
    runs-on: ubuntu-latest
    # The Pages deploy rides this required job (ISSUES.md I75): it already builds the whole deployable
    # site (wasm engine + Postgres + chibicc + self-host), so assembling + uploading the Pages artifact
    # here — on a main push — means the deploy needs no separate heavy job that starves for a runner.
    # The `deploy-pages` job below publishes it; `site_ok` gates it. `pages: write` is for
    # `configure-pages`; the assemble step is fail-soft so a Pages-asset hiccup never reds this gate.
    permissions:
      contents: read
      pages: write
    outputs:
      site_ok: ${{ steps.pages_site.outputs.ok }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with: { components: rust-src }
      # Three workspaces: `browser` (the wasm engine), the root (temen-run's `prep_temen`/`build_image`),
      # and the workspace-excluded `crates/temen-llvm` (`temen-llvm-translate`). The latter two build the
      # Postgres regenerate half below; caching them is what keeps a warm run's re-translate at ~30s
      # instead of a release rebuild of the translator on every run.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            browser
            .
            crates/temen-llvm
      # Playwright + Chromium aren't preinstalled on the runner (unlike Node); install both.
      # ISSUES.md I34: an npm/CDN stall wedged this step >30 min on 2026-07-23 (24 s – 3 min
      # healthy) — bound it so a stall fails fast into a re-run instead of pinning the runner.
      - name: Install Playwright + Chromium
        timeout-minutes: 10
        working-directory: browser
        run: |
          # I67/#1017: `--with-deps` runs its own internal `apt-get update`, so the azure-mirror
          # scrub must happen here too — the hardened LLVM step below runs after this one.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium

      # LLVM is needed on EVERY run, not just a cold one: build-pg-assets.mjs hands the translator
      # `postgres_shimmed.bc`, and the `.bc` path shells `llvm-dis` out-of-process (temen-llvm links no
      # libLLVM). clang/flex/bison are Postgres's own build deps — used only on a cold input cache.
      - name: install LLVM/clang 18 (+ Postgres build deps)
        run: |
          # ISSUES.md I67: drop the runner's unused microsoft/azure apt sources so a transient
          # 403/outage from those mirrors can't fail `apt-get update` before we install anything.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 flex bison
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      # Regenerate the Postgres artifacts from current code and stage them into web/assets/, so the
      # `browser-test.mjs` Postgres check BOOTS instead of SKIPping (it skips when unstaged). That boot
      # is the drift guard: a translator/encoder change that breaks the database fails the PR that
      # introduces it rather than the next deploy. The cached inputs (whole-program bitcode + initdb'd
      # cluster) are code-independent, so keying them on the Postgres version + shim sources is sound.
      - name: cache Postgres build inputs
        uses: actions/cache@v4
        with:
          path: |
            /tmp/temen_pg_cache/postgres_shimmed.bc
            /tmp/temen_pg_cache/pgdata
          key: pg-inputs-v1-${{ env.TEMEN_PG_VER }}-${{ hashFiles('crates/temen-run/demos/postgres/**') }}
      # TEMEN_PG_VER comes from the workflow env above — the same value that keyed the cache.
      - name: build + stage Postgres artifacts
        working-directory: browser
        env:
          TEMEN_PG_CACHE: /tmp/temen_pg_cache
        run: node build-pg-assets.mjs
      # Stage chibicc.temen for the playground C-compiler card so browser-play-editor-test.mjs runs its
      # compile-and-run assertion (rather than SKIPping). Uses the same LLVM-18/clang installed above;
      # fail-soft so a build hiccup degrades to a SKIP, never a red build (the test guards on the asset).
      - name: build + stage chibicc asset
        working-directory: browser
        # Block scalar: the inline JS contains a colon-space ("skipped: "+e.message) which is invalid
        # as a YAML plain scalar (GHA rejects the whole file). This pending step was never valid to
        # copy over as-is; `|` makes the body literal. Fixed here so the workflows-in-sync guard's
        # copy-over can't break CI parsing.
        run: |
          node -e "try{require('child_process').execFileSync('bash',['../crates/temen-run/demos/chibicc_selfhost/build_chibicc_temen.sh'],{stdio:'inherit'});require('fs').copyFileSync('/tmp/temen_chibicc_cache/chibicc.temen','web/assets/chibicc.temen');console.log('staged chibicc.temen')}catch(e){console.log('chibicc asset skipped: '+e.message)}"
      # The self-host closure image (chibicc_selfhost.img) for the "chibicc compiles its own source" card:
      # chibicc's own cc1 TU sources + the glibc header closure, seeded so browser-play-editor-test.mjs can
      # run chibicc.temen --emit-object over them and diff the object against native chibicc (which this step
      # also builds, for `-M` closure discovery + the byte-identity oracle). Fail-soft → the test SKIPs.
      - name: build + stage self-host closure image
        working-directory: browser
        run: node build-selfhost-assets.mjs || echo "self-host image skipped"
      # gencorpus (native) writes the corpus; build the wasm32 THREADS module (shared memory + atomics,
      # so it needs -Z build-std); then drive it in real Chromium under COOP/COEP.
      - name: Build threads module + run in Chromium (powerbox + multi-Worker → 4000)
        working-directory: browser
        run: |
          cargo run --bin gencorpus
          RUSTFLAGS="-Ctarget-feature=+atomics,+bulk-memory,+mutable-globals \
            -Clink-arg=--shared-memory -Clink-arg=--import-memory -Clink-arg=--max-memory=1073741824 \
            -Clink-arg=--export=__stack_pointer -Clink-arg=--export=__tls_base \
            -Clink-arg=--export=__tls_size -Clink-arg=--export=__tls_align \
            -Clink-arg=--export=__wasm_init_tls" \
            cargo +nightly build -Z build-std=std,panic_abort --release --lib --target wasm32-unknown-unknown
          node browser-test.mjs
          # wasm-JIT reactor differential: each committed reactor guest (bounce/life/mandelzoom) must
          # render byte-identically on the interpreter and the emitted-wasm tier (cap-call outlining).
          # Reuses the threads module built above + the committed `.temen` assets — no extra toolchain.
          node browser-jit-reactor-test.mjs
          # slice-1 cross-Run compiled-Module cache (WASM_AOT.md): re-Running the same module with a
          # stable key must produce byte-identical stdout every Run and compile exactly once. Uses the
          # committed hello_c/qjs_repl assets; skips cleanly if absent.
          node browser-jit-cache-test.mjs
          # warm-runtime snapshot (WASM_AOT.md follow-on): temen_warm_open runs the QuickJS `warmup` once,
          # temen_warm_eval restores the post-init image and runs `eval_run` — which must match the cold
          # `_start` path byte-for-byte while skipping the runtime rebuild. Uses the committed
          # qjs_snapshot.temen; skips cleanly if absent.
          node warm-snapshot-test.mjs
          # warm+JIT (WASM_AOT.md warm+JIT): temen_warm_jit_open emits `eval_run` to wasm and runWarmJit
          # drives it over the restored snapshot — must match warm-interp (temen_warm_eval) byte-for-byte,
          # keep fresh-per-Run isolation, and accelerate a compute-heavy eval. Same asset; skips if absent.
          node warm-jit-test.mjs
          # Lua warm snapshot (issue #805): the two-phase lua_snapshot driver — warm eval_run over the
          # restored snapshot must match the cold _start (interp + warm+JIT) byte-for-byte, and isolation
          # must hold. Uses the committed lua_snapshot.temen; skips cleanly if absent.
          node lua-warm-snapshot-test.mjs
          # Tcl warm snapshot (issue #805 follow-on): the two-phase tcl_snapshot driver — warm eval_run over
          # the restored snapshot must match the cold _start byte-for-byte, and isolation must hold (Tcl's
          # warm+JIT declines, so interpreter-only). The tcl_snapshot.temen is deploy-built (Tcl fetch +
          # toolchain isn't in this job), so this SKIPs cleanly when it's absent.
          node tcl-warm-snapshot-test.mjs
          # snapshot worker (WASM_AOT.md warm+JIT · issues #804/#805): each warm card (QuickJS, Lua) runs its
          # warm session on a dedicated Worker (own engine + memory), pre-warmed off the main thread — one
          # worker per module so both stay warm. Chromium-drives play.html and asserts both cards run on both
          # warm tiers *through the worker* (not a silent main-thread fallback) and isolation holds. Committed
          # assets; skips cleanly if absent.
          node snapshot-worker-test.mjs
          # slice-2 mainline tier-up over a live window (WASM_AOT.md + the slice-0 JACL residual): an
          # TEMEN-text compute guest whose root loops calling a window-round-tripping leaf must return the
          # same value with tier-up on as all-interp, and tier-up must actually fire (the shape the
          # TEMEN-text 'plain' recipe now defaults on). No assets — parses in-page via temen_parse.
          node browser-tierup-mainline-test.mjs
          node browser-play-editor-test.mjs
          # chibicc compile-time on V8 (bytecode vs wasm-JIT) — prints the speedup and asserts the two
          # tiers emit byte-identical IR (a second guard alongside chibicc_jit.rs). Uses the committed/
          # staged chibicc.temen; SKIPs if it's absent. Timing is informational — it only FAILs on IR
          # divergence. See SELFHOST_C.md §7 (wasm-JIT tier) / PR #483.
          node bench_chibicc_jit.mjs
          node pg-reload-test.mjs
          # The temen-posix shell card (STAGE1.md): stage the committed shell fixture into web/assets,
          # then drive `temen_run_shell` in real Chromium and assert the script's stdout. The test
          # skips cleanly if the asset is absent, so the copy is what makes it actually run.
          cp tests/fixtures/shell.temen web/assets/shell.temen
          node browser-shell-test.mjs
          # DAP-over-bytecode debugger through the wasm FFI: drive a full initialize→launch→breakpoint→
          # variables→terminate conversation in Chromium on the bytecode engine (DEBUGGING.md).
          node browser-dap-test.mjs

      # ---- Pages deploy (main push only): assemble the site this job already built, then upload it as a
      # Pages artifact for the `deploy-pages` job. FAIL-SOFT by construction — the step never exits
      # nonzero, so a Pages-asset hiccup can't red this required gate; a missing REQUIRED asset just sets
      # `ok=false` and the deploy is skipped (the scheduled `pages.yml` fallback catches it later, via its
      # DEPLOYED_SHA gate). Mirrors `pages.yml`'s assemble+verify (same working-directory + commands).
      - name: assemble + verify playground site
        id: pages_site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: browser
        run: |
          # The on-ramp module assets the site references but this job doesn't otherwise build
          # (sqlite/lua/tcl/doom/gpu_shader + the shell command chain). Fail-soft: a MAY_BE_ABSENT card
          # (doom/tcl) degrades to a hint; a required-asset miss is caught by check-play-assets below.
          node build-onramp-assets.mjs || echo "on-ramp assets: some skipped"
          SITE="$GITHUB_WORKSPACE/_site"
          mkdir -p "$SITE/web/assets" "$SITE/target/wasm32-unknown-unknown/release"
          cp -r web/. "$SITE/web/"
          cp target/wasm32-unknown-unknown/release/temen_browser.wasm "$SITE/target/wasm32-unknown-unknown/release/"
          cat > "$SITE/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=web/play.html" />
          <title>Temen playground</title></head>
          <body><p>Redirecting to the <a href="web/play.html">Temen playground</a>…</p></body></html>
          HTML
          # Marker the scheduled pages.yml gate reads to know the site is already at HEAD (skip its build).
          echo "$GITHUB_SHA" > "$SITE/DEPLOYED_SHA"
          echo "assembled:"; find "$SITE" -type f | sed "s|$SITE|_site|"
          # Reachability gate (ISSUES.md I26/I42/I49): a required asset missing ⇒ skip the deploy rather
          # than ship a 404 — but never fail this required job over it.
          if node check-play-assets.mjs --site "$SITE"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "playground site incomplete — skipping Pages deploy (see check-play-assets)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages_site.outputs.ok == 'true'
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_site.outputs.ok == 'true'
        with: { path: _site }

  # Publish the artifact browser-real uploaded. A seconds-long job that rides browser-real's already-won
  # slot — no separate heavy build to starve (ISSUES.md I75). Only on a main push where the site
  # assembled cleanly; a superseded main run is cancelled with the rest of its CI (top-level
  # concurrency), and the github-pages environment serializes against the scheduled pages.yml fallback.
  deploy-pages:
    name: deploy playground to Pages
    needs: browser-real
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.browser-real.outputs.site_ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  embench-differential:
    # Whole-stack differential on the real Embench-IoT suite — every engine's `verify` must equal
    # native's (1). EMBENCH_STRICT makes a MISCOMPILE or an on-ramp build/translate failure fail the
    # job. This is the net that caught the qrduino soundness bug, so it gates every PR.
    name: embench differential (all engines · wasm32/wasm64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            crates/temen-llvm
            bench/cross-engine/wasmtime-rs
      - name: install LLVM/clang 18 (clang for the kernels & wasm, llvm-dis for the on-ramp)
        run: |
          # ISSUES.md I67: drop the runner's unused microsoft/azure apt sources so a transient
          # 403/outage from those mirrors can't fail `apt-get update` before we install anything.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: fetch Embench-IoT (not vendored — mixed per-kernel licenses)
        # -f + retries: codeload sometimes serves an error page instead of the tarball, which
        # `curl -sS | tar xz` can't detect ("not in gzip format" — ISSUES.md I18 class 4).
        run: |
          curl -sSL -f --retry 5 --retry-all-errors https://github.com/embench/embench-iot/archive/refs/heads/master.tar.gz | tar xz -C /tmp
          echo "EMBENCH=/tmp/embench-iot-master" >> "$GITHUB_ENV"
      - name: build the in-process Wasmtime runner (populates the wt/* columns)
        run: cargo build --release --bin embench_one --manifest-path bench/cross-engine/wasmtime-rs/Cargo.toml
      - name: embench differential (strict — MISCOMPILE or on-ramp failure ⇒ red)
        env:
          EMBENCH_STRICT: "1"
        run: cargo run --release --example embench --manifest-path crates/temen-llvm/Cargo.toml

  cross-engine-differential:
    # Soundness gate for the cross-engine bench harness (crates/temen-llvm/examples/cross_engine.rs).
    # It runs each kernel's LLVM-frontend IR on the bytecode engine *compiled to wasm* (the
    # `temen-bytecode-wasm` row, via browser/bench.mjs on Node) and cross-checks every result against
    # native bytecode. The harness prints `MISCOMPILE` on a mismatch but doesn't itself exit non-zero,
    # so this step greps for it — and asserts the row actually ran, so a missing cdylib/node can't pass
    # silently. Linux-only, like `temen-llvm` (the on-ramp shells out to clang/llvm-dis). The perf
    # numbers it also prints are informational — the perf signal is the separate non-gating `bench` job.
    name: cross-engine differential (temen-bytecode-wasm vs native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            crates/temen-llvm
            browser
      - name: install LLVM/clang 18 (clang for the kernels, llvm-dis for the on-ramp)
        run: |
          # ISSUES.md I67: drop the runner's unused microsoft/azure apt sources so a transient
          # 403/outage from those mirrors can't fail `apt-get update` before we install anything.
          sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - run: rustup target add wasm32-unknown-unknown
      - name: build the temen-browser wasm32 cdylib (so the temen-bytecode-wasm row runs)
        run: cargo build --release --lib --target wasm32-unknown-unknown --manifest-path browser/Cargo.toml
      - name: cross-engine differential (MISCOMPILE ⇒ red)
        run: |
          set -o pipefail
          cargo run --release --example cross_engine --manifest-path crates/temen-llvm/Cargo.toml 2>&1 | tee xe.log
          if grep -q MISCOMPILE xe.log; then
            echo "::error::cross-engine differential found a MISCOMPILE"; exit 1
          fi
          if ! grep -q '^temen-bytecode-wasm,' xe.log; then
            echo "::error::temen-bytecode-wasm row did not run (node or temen-browser cdylib missing?)"; exit 1
          fi

  stack-guard:
    # `stack-check` gates the `temen-jit` guard test suites (`tests/stack_check.rs`,
    # `tests/stack_guard_fuzz.rs`) into this dedicated lane — the gating `check` job builds without it,
    # so this is the ONLY lane that compiles + runs them (single- and multi-vCPU fiber recursion must
    # trap StackOverflow). The arena stack allocator they exercise is temen-fiber's always-on default, so
    # no feature selects it. Linux runtime + a windows-gnu cross-check for compile parity (the arena's
    # VirtualAlloc path and the ABI-param threading) without needing a Windows runtime runner.
    name: fiber-scaling features (stack-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}", components: clippy }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy -p temen-jit --features stack-check --all-targets -- -D warnings
      - run: cargo test -p temen-jit --features stack-check
      # The stack-guard soundness fuzz's hole-oracle is the PROT_NONE guard page, present only on the
      # default (non-arena) backend. The line above runs the check on the arena backend it ships with;
      # this runs the fuzz on the guard-page backend so a frame that slips past the check faults
      # (MemoryFault/crash) instead of silently corrupting a neighbour slot. (STACK_GUARD_FLIP.md #1.)
      - run: cargo test -p temen-jit --features stack-check --test stack_guard_fuzz
      # Compile parity for the feature-gated code on Windows. mingw is needed for the §5 trap-capture
      # C shim (as in the `check` job's cross-check).
      - run: rustup target add x86_64-pc-windows-gnu
      # ISSUES.md I34: this exact step stalled 29 min on 2026-07-23 until the run was cancelled —
      # bound it so an apt-mirror wedge fails fast into a re-run.
      - name: install mingw cross toolchain
        timeout-minutes: 15
        run: sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure* && sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true && sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo clippy -p temen-jit --features stack-check --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  stack-guard-cross-os:
    # Runtime coverage of the feature-gated code on aarch64 (macOS) + x86-64 Windows — the arena's
    # VirtualAlloc path and the software guard have not run there yet. NON-GATING (continue-on-error)
    # until proven green, mirroring the `cross-os` posture for the unverified windows guard; drop
    # continue-on-error to make it gating once it passes.
    name: fiber-scaling features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test -p temen-jit --features stack-check

  rustbench:
    name: rustbench (real-program perf · temen-jit vs Wasmtime-w64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { toolchain: "${{ env.RUST_STABLE }}" }
      - name: install workload toolchains
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup +1.81.0 target add wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: bench }
      - name: rustbench
        working-directory: bench
        run: cargo run --release --bin rustbench

