[package]
name = "temen-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# This crate is intentionally OUTSIDE the workspace (see root Cargo.toml `exclude`).
# It requires a nightly toolchain + cargo-fuzz:
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run decode_verify
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
temen = { path = "../crates/temen" }
temen-ir = { path = "../crates/temen-ir" }
temen-encode = { path = "../crates/temen-encode" }
temen-verify = { path = "../crates/temen-verify" }
temen-spec = { path = "../crates/temen-spec" } # executable ISA spec — oracle for the spec_* targets
temen-interp = { path = "../crates/temen-interp" }
temen-jit = { path = "../crates/temen-jit" }
temen-durable = { path = "../crates/temen-durable" }
temen-snapshot = { path = "../crates/temen-snapshot" } # §12 snapshot codec, exercised x-backend by durable_jit
temen-run = { path = "../crates/temen-run" } # production cap.call thunk, for irgen's Memory-cap success path
temen-mask = { path = "../crates/temen-mask" }
temen-text = { path = "../crates/temen-text" }
temen-wasm = { path = "../crates/temen-wasm" } # untrusted core-wasm frontend, fuzzed for fail-closed decode
temen-opt = { path = "../crates/temen-opt" } # generic IR→IR optimizer, fuzzed for the SSA round-trip identity
temen-llvm = { path = "../crates/temen-llvm" } # LLVM on-ramp, fuzzed for translation miscompiles (onramp_diff)
temen-wasm-jit = { path = "../crates/temen-wasm-jit" } # backend 4, fuzzed for confinement miscompiles (wasm_diff)
# `simd` enables wasmi's §17 v128 proposal (`Config::wasm_simd`), needed by `wasm_diff` (the core v128
# lane ops are in the wasm-JIT's integer subset). The emitted wasm runs under wasmi as the escape oracle.
wasmi = { version = "0.47", features = ["simd"] }

[[bin]]
name = "opt_ssa_roundtrip"
path = "fuzz_targets/opt_ssa_roundtrip.rs"
test = false
doc = false
bench = false

