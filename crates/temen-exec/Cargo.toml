# The deterministic `exec` capability backend + the shared exec-cap wire protocol (op codes, argv
# parsing, errno values). Pure — depends only on `temen-interp` for the `HostFn`/`GuestMem`
# interface — so it builds for **wasm** (the browser cdylib grants a `scripted_exec` with no host
# processes), unlike `temen-run` which pulls in the unix-only JIT. `temen-run` keeps the real
# subprocess `host_exec` backend and wraps these handlers in its `HostCap`. See EXEC.md and
# `crates/temen-run/src/exec.rs`.
[package]
name = "temen-exec"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
temen-ir.workspace = true
temen-interp.workspace = true
