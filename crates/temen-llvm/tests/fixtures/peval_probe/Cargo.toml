# The **in-sandbox `temen-peval` probe** (DESIGN.md §20c → the in-repo pipeline).
#
# A `no_std`/`panic=abort` powerbox program that depends on `temen-peval` (`default-features = false`,
# the in-temen build — no `libm`) and `temen-ir`, builds a small module, calls `temen_peval::specialize`,
# and prints a summary of the residual. The `peval_in_sandbox.rs` test in the parent crate compiles
# this to LLVM bitcode (`rustc`), links + `globaldce`s the `specialize` closure, translates
# it to temen-IR, and runs it on the reference interpreter — the manual probe, folded into a test.
#
# Its own `[workspace]` keeps it out of the repo's root workspace (which excludes `crates/temen-llvm`);
# it is built directly by the test, never as a workspace member.
[package]
name = "peval-probe"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# A `lib` (not a `bin`): `cargo build` emits the per-crate `.bc` with no final executable link (the
# powerbox externs `malloc`/`free`/`write` are intentionally undefined — the on-ramp synthesizes
# them), so the build exits cleanly. The `#[no_mangle] main` is kept by `globaldce`'s public-api list.
crate-type = ["lib"]

[dependencies]
# The specializer, in its **in-temen** configuration: `default-features = false` drops `libm` (whose
# `fma` brings untranslatable x86 inline-asm + i128), exactly as the in-sandbox build requires.
temen-peval = { path = "../../../../temen-peval", default-features = false }
temen-ir = { path = "../../../../temen-ir" }

[profile.release]
panic = "abort"
opt-level = 2
overflow-checks = false

# Empty workspace table: this fixture is its own root, not a member of the repo workspace.
[workspace]
