[package]
name = "temen-bytecode"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Pure stackless bytecode compiler and VM loop (`Engine::Bytecode`, #3187 / #3195).
# `#![forbid(unsafe_code)]`, wasm32/wasm64-clean, zero dependency on `temen-interp` or `temen-jit`.
# Compiles verified `temen_ir::Module` into flat register-window ops and steps contexts against
# `temen-mem` + `temen-mask` + a Carrier-owned `FuelCell`, returning `temen_kernel::Step`.

[dependencies]
temen-ir.workspace = true
temen-mask.workspace = true
temen-mem.workspace = true
temen-kernel.workspace = true
libm = "0.2"
