# The in-memory `fs` capability backend + the shared fs-cap wire protocol (op codes, `stat` layout,
# path vetting). Pure — depends only on `temen-interp` for the `HostFn`/`GuestMem` interface — so it
# builds for **wasm** (the browser cdylib mounts a data-image `mem_fs` without a real filesystem),
# unlike `temen-run` which pulls in the unix-only JIT. `temen-run` keeps the real-filesystem `host_fs`
# backend and wraps these handlers in its `HostCap`. See `crates/temen-run/src/fs.rs`.
[package]
name = "temen-fs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
temen-ir.workspace = true
temen-interp.workspace = true
temen-encode = { path = "../temen-encode" }
