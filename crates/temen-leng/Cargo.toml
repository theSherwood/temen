[package]
name = "temen-leng"
version = "0.0.0"
edition = "2021"
publish = false

# The **fourth frontend** (NIM.md Phase 2): a Leng-NIF → TEMEN-IR translator. Leng is nimony's
# C-like midlevel IR (the seam its C/C++/LLVM/arkham backends already consume). Like the chibicc
# fork, `temen-wasm`, and `temen-llvm`, this is NOT part of the escape-TCB: it consumes the core crates
# to produce a Module and is never a dependency of temen-jit/temen-interp — everything it emits is
# re-verified by temen-verify, so a translation bug is a clean error, never an escape (DESIGN.md §2a).
#
# Status: a walking skeleton — the integer/arithmetic/call/local subset, straight-line + `ret`,
# with fail-closed `Unsupported` for everything else (control flow, aggregates, pointers, floats).
# It emits Temen text (temen_text::parse_module) the way chibicc's codegen_ir.c does; growing it means
# adding grammar arms, not rearchitecting.

# `float` (default on) lowers float literals/consts. Turning it **off** (`default-features = false`)
# makes float literals fail-closed and — the point — prunes `emit_fconst`'s decimal formatting and
# the `f64` parser, so a **guest** build of temen-leng carries no `core::num::flt2dec`/`dec2flt` (the
# u128/vector float algorithms `temen-llvm` doesn't yet lower — W5 §3e, path (b)). Integer Leng only.
[features]
default = ["float"]
float = []

[dependencies]
temen-ir = { path = "../temen-ir" }
temen-text = { path = "../temen-text" }
temen-encode = { path = "../temen-encode" }

[dev-dependencies]
temen-verify = { path = "../temen-verify" }
temen-interp = { path = "../temen-interp" }
temen-jit = { path = "../temen-jit" }
# Test-only: the reference embedding + host glue (`Instance`, `instantiate_with_imports`, `HostCap`)
# for running the nimony I/O powerbox module through the real cap-granting path on both engines.
# temen-run's *library* does not depend on temen-leng (only its own tests do), so this dev-edge
# introduces no cycle.
temen-run = { path = "../temen-run" }
# Test-only: the POSIX personality (`temen_posix::cap`) whose `write(fd, buf, n)` matches the nimony
# `sysWrite(fd, buf, n)` bottom edge exactly — the caps the retained nim-name syscall imports bind to.
temen-posix = { path = "../temen-posix" }
