[package]
name = "temen-capi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The C ABI over the `temen-run` embedding surface (POWERBOX.md Phase 5): parse a manifest module,
# bind host capabilities by name (built-ins or C function pointers), instantiate, and run on any
# backend under a uniform config — for consumers who embed from C rather than Rust. `rlib` is for the
# in-crate ABI test; `cdylib`/`staticlib` are what a C program links against (`temen.h`).
[lib]
name = "temen_capi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
temen-ir.workspace = true
temen-text.workspace = true
temen-encode.workspace = true
temen-interp.workspace = true
temen-run = { path = "../temen-run" }
