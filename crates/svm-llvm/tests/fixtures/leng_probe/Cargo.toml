# W5 slice-2 probe (NIM.md §3e): the **real** `svm-leng` translator as an svm guest. A powerbox
# program that calls `svm_leng::translate_to_text` on a fixed Leng module and returns a checksum of
# the emitted SVM text. The `w5_leng_guest.rs` test in the parent crate compiles this to LLVM IR
# (`rustc +1.81`), links + prunes to the closure reachable from `main`/`malloc`/`free`, translates it
# to svm-IR, and runs it — asserting the in-sandbox checksum equals the same translation run host-side.
#
# Unlike the `peval_*` probes this is a **std** crate (svm-leng is std): the experiment is whether a
# std Rust program translates once its only real externals are the allocator (getrandom removed by
# svm-leng's deterministic hasher). Its own `[workspace]` keeps it out of the root workspace.
[package]
name = "leng-probe"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# A `lib`: `cargo build` emits per-crate `.ll` with no final executable link (the powerbox externs
# `malloc`/`free` are intentionally undefined — the on-ramp synthesizes them). The `#[no_mangle] main`
# is kept by `globaldce`'s public-api list.
crate-type = ["lib"]

[dependencies]
svm-leng = { path = "../../../../svm-leng" }

[profile.release]
panic = "abort"
opt-level = 2
overflow-checks = false

[workspace]
