# The `svm-leng.svmb` guest (NIM.md §3e / W5 capstone): the `svm-leng` translator wrapped as a
# powerbox program — read a Leng-NIF module from stdin, translate it, write the SVM text to stdout.
# Built through the LLVM on-ramp (`-Z build-std` → `llvm-link-18` → `svm-llvm-translate --binary` →
# `prep_svmb`, all in `build_leng_svmb.sh`) into the committed `svm-leng.svmb` asset. Not part of the
# escape-TCB: everything it emits is re-verified by svm-verify (DESIGN.md §2a). Its own `[workspace]`
# keeps it out of the root workspace (it builds under a pinned `rustc +1.81` with `build-std`).
[package]
name = "leng-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# A `lib`: `cargo build` emits per-crate `.ll` with no final executable link. `read`/`write` are the
# only undefined externs the on-ramp maps (to the powerbox stdin/stdout Stream caps); the guest
# allocates from a static arena via its own `#[global_allocator]`, so there is no `malloc` extern.
crate-type = ["lib"]

[dependencies]
# The translator under test, as a real dependency — the whole `std` crate (float on) monomorphizes
# into the guest's own IR, exactly as the `leng_probe` fixture proved in W5 slice 2.
svm-leng = { path = "../../../../svm-leng" }

[profile.release]
panic = "abort"
opt-level = 2
overflow-checks = false

[workspace]
