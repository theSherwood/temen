# The `temen-leng.temen` guest (NIM.md §3e / W5 capstone): the `temen-leng` translator wrapped as a
# powerbox program — read a Leng-NIF module from stdin, translate it, write the Temen text to stdout.
# Built through the LLVM on-ramp (`-Z build-std` → `llvm-link` → `temen-llvm-translate --binary` →
# `prep_temen`, all in `build_leng_temen.sh`) into the committed `temen-leng.temen` asset. Not part of the
# escape-TCB: everything it emits is re-verified by temen-verify (DESIGN.md §2a). Its own `[workspace]`
# keeps it out of the root workspace (it builds under `rustc` with `build-std` (`RUSTC_BOOTSTRAP=1`)).
[package]
name = "leng-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# A `lib`: `cargo build` emits per-crate `.ll` with no final executable link. `read`/`write` are the
# only undefined externs the on-ramp maps (to the powerbox stdin/stdout Stream caps); the guest
# allocates from a static arena via its own `#[global_allocator]`, so there is no `malloc` extern.
crate-type = ["lib"]

[dependencies]
# The translator under test, as a real dependency — the whole `std` crate (float on) monomorphizes
# into the guest's own IR, exactly as the `leng_probe` fixture proved in W5 slice 2.
temen-leng = { path = "../../../../temen-leng" }

[profile.release]
panic = "abort"
opt-level = 2
overflow-checks = false

[workspace]
