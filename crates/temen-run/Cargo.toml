[package]
name = "temen-run"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The embedding runtime: instantiate a verified module with the MVP powerbox (§3e) and run it
# on the Cranelift JIT. Pulls in `temen-jit` (Cranelift), so it is kept *out* of the light `temen`
# umbrella crate — the same split as `bench/`, but in-workspace (Cranelift is already a
# workspace build cost via `temen-jit`, so this adds no new heavy dependency).

[lib]
name = "temen_run"
path = "src/lib.rs"

[[bin]]
name = "temen-run"
path = "src/main.rs"

# The `.temen` packaging step (#907): demote non-entry-point exports to strippable diagnostic names
# (the `strip`-with-a-keep-list analogue) so a shipped single-module artifact carries a lean semantic
# exports table without losing named stack traces.
[[bin]]
name = "temen-strip"
path = "src/bin/temen_strip.rs"

[dependencies]
temen-ir.workspace = true
temen-text.workspace = true
temen-encode.workspace = true
temen-verify.workspace = true
# §4 durability × §22 guest-JIT: the durable instrumentation pass, run on submitted units in a durable
# domain (grant_jit_durable). Tooling-tier (temen-durable → temen-ir only), so no TCB layering concern.
temen-durable.workspace = true
temen-interp.workspace = true
temen-exec.workspace = true
temen-fs.workspace = true
# The POSIX personality (temen-posix): exposed as a named `HostCap` (`posix_cap`) so the LLVM on-ramp
# world (powerbox caps, `__vm_host_call`) can reach the process/fd/signal ABI (POSIX.md).
temen-posix.workspace = true
temen-jit.workspace = true
# The partial-evaluation on-ramp (§20c): the `--specialize` path turns an interpreter + a fixed
# program into a compiled residual (a pure `Module → Module` transform; the residual is re-verified).
temen-peval.workspace = true
# The generic IR→IR optimizer (OPT.md): CFG cleanup of the residual before re-verify/encode.
temen-opt.workspace = true

[dev-dependencies]
# W4 (NIM.md §3c): run a *real* temen-leng-compiled program as an isolated `domain_exec` child, not a
# hand-written stand-in phase. Test-only, and temen-leng does not depend on temen-run, so no cycle.
temen-leng = { path = "../temen-leng" }

[target.'cfg(unix)'.dependencies]
# Real `map`/`unmap`/`protect` for the Memory capability (§3e): `mprotect` on the JIT window
# pages, mirrored by a software page-state map (so cap-buffer borrows fail closed rather than
# faulting the host). Unix-only, like the JIT's guard page itself (`temen-jit` is unix-only).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The windows Memory-cap backend (§3e): `VirtualProtect` / placeholder-aware commit on the JIT window
# pages — the same software-page-map model as the unix `mprotect` path, only the syscalls differ.
# `GetSystemInfo` supplies the host page size. §13 SharedRegion (issue #1) adds `MapViewOfFile3` +
# `CreateFileMappingW` shared views: `Win32_System_Threading` for `GetCurrentProcess`, and
# `Win32_Security` gates `CreateFileMappingW` (its `SECURITY_ATTRIBUTES` parameter).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
] }
