[workspace]
resolver = "2"
members = [
    "crates/temen-ir",
    "crates/temen-mask",
    "crates/temen-mem",
    "crates/temen-text",
    "crates/temen-durable",
    "crates/temen-encode",
    "crates/temen-verify",
    "crates/temen-opt",
    "crates/temen-peval",
    "crates/temen-interp",
    "crates/temen-exec",
    "crates/temen-fs",
    "crates/temen-dap",
    "crates/temen-snapshot",
    "crates/temen-fiber",
    "crates/temen-jit",
    "crates/temen",
    "crates/temen-spec",
    "crates/temen-run",
    "crates/temen-wasm",
    "crates/temen-wasm-jit",
    "crates/temen-leng",
    "crates/temen-posix",
    "crates/temen-capi",
    "crates/temen-parity",
]
# `fuzz/` is a cargo-fuzz crate (nightly + libfuzzer-sys); `bench/` pulls in Wasmtime for
# the comparison harness; `crates/temen-llvm` is the AOT LLVM→IR on-ramp (D54 — an opt-in,
# Linux-dev-only lane, off the runtime path; links no libLLVM since the textual-`.ll` reader,
# but its tests shell out to `clang`/`llvm-dis`). All three are kept out of the workspace so
# `cargo build --workspace` / `cargo test` never pull them in.
exclude = ["fuzz", "bench", "crates/temen-llvm", "crates/temen-webgpu"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

# Keep the escape-TCB crates dependency-free (small, fast to compile, easy to audit).
# External deps live only in dev/bench/fuzz.
[workspace.dependencies]
temen-ir = { path = "crates/temen-ir" }
temen-mask = { path = "crates/temen-mask" }
temen-mem = { path = "crates/temen-mem" }
temen-text = { path = "crates/temen-text" }
temen-durable = { path = "crates/temen-durable" }
temen-encode = { path = "crates/temen-encode" }
temen-verify = { path = "crates/temen-verify" }
# `default-features = false` here so dependents opt into `libm-floats` explicitly (the in-temen build
# needs it off); host consumers pull it in transitively via `temen-peval`'s default feature.
temen-opt = { path = "crates/temen-opt", default-features = false }
temen-peval = { path = "crates/temen-peval" }
temen-interp = { path = "crates/temen-interp" }
temen-exec = { path = "crates/temen-exec" }
temen-fs = { path = "crates/temen-fs" }
temen-posix = { path = "crates/temen-posix" }
temen-snapshot = { path = "crates/temen-snapshot" }
temen-fiber = { path = "crates/temen-fiber" }
temen-jit = { path = "crates/temen-jit" }
temen-spec = { path = "crates/temen-spec" }
temen-wasm-jit = { path = "crates/temen-wasm-jit" }
temen-parity = { path = "crates/temen-parity" }

# CI wall clock + the local pre-push hook: this tree's tests are **execution** bound, not compile
# bound. A `cargo test --workspace` run spends its time with guests *running* inside the engines
# (`temen-interp`'s tree-walker above all), so building those engines unoptimized charges an
# order-of-magnitude tax on every test. Measured on `temen-run`'s `nimlink_asset` — the dominant test
# in the `build · test · fmt · clippy` job — **599s -> 58s**.
#
# It has to be `[profile.dev]`, not `[profile.dev.package."*"]`: the `"*"` glob is dependencies only
# and explicitly excludes workspace members, which is exactly where the hot code lives here.
# (`temen-llvm` and `browser` are separate workspaces, so over there the engines *are* dependencies
# and they use the glob — same rule, spelled the way each workspace's graph requires.)
#
# The cost is the crate you are editing rebuilding optimized: a from-scratch `temen-interp` goes
# 13s -> 40s. Incremental edits are unchanged (~1-2s). `debug-assertions` and overflow checks are
# independent of `opt-level` — they stay on, so every assert the §9 oracle relies on still fires.
#
# This also **is** the regression guard for #1466. Optimized codegen is what let LLVM hoist a
# thread-pointer resolution above a fiber stack switch; with this profile, `fiber_fuzz` and
# `jit_threads` — the empirical net for the §23 3c argument — finally run per-PR in a build where the
# optimizer is allowed to misbehave. Before this they only ever ran at `opt-level = 0`, which is why
# the bug sat unseen. Do not lower this to dodge a failure in that pair: a failure there is real.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
